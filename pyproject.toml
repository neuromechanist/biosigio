[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biosigio"
version = "1.2.8"
authors = [
    { name = "Seyed Yahya Shirazi", email = "shirazi@ieee.org" }
]
maintainers = [
    { name = "Seyed Yahya Shirazi", email = "shirazi@ieee.org" }
]
description = "A unified interface to import, convert, and serve biosignal data (EEG, EMG, MEG, iEEG) across formats, including EDF/BDF, EEGLAB, BrainVision, FIF, and a cloud-native Zarr serving store"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "biosignal",
    "electrophysiology",
    "eeg",
    "emg",
    "electromyography",
    "meg",
    "ieeg",
    "eeglab",
    "edf",
    "bdf",
    "brainvision",
    "wfdb",
    "trigno",
    "delsys",
    "zarr",
    "bids",
    "neuroscience",
    "signal-processing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "pyedflib>=0.1.30",
    "wfdb>=4.0.0",
    "pyxdf>=1.16.0",
]

[project.scripts]
biosigio = "biosigio.cli:main"

[project.optional-dependencies]
# MEG (.fif / CTF .ds / KIT .con/.sqd/.kdf / 4D-BTi) and BrainVision (.vhdr)
# import are backed by MNE, kept out of the core deps (MNE is heavy).
# `uv sync --extra meg`. mne>=1.6 covers every format in this extra except
# MEF3 (see the `mef3` extra below, which pins a newer MNE on its own).
meg = [
    "mne>=1.6",
]
# MEF3 (.mefd) iEEG import needs mne>=1.12 (mne.io.read_raw_mef, new in 1.12)
# plus pymef (the MEF3 C-library wrapper MNE's reader delegates to). Kept as
# its own extra rather than folded into `meg` so installing `meg` alone never
# forces the newer MNE floor onto users who only need .fif/.ds/.con/.bti.
# `uv sync --extra mef3` pulls in a compatible MNE transitively via the
# version resolver; the MEF3Importer also checks the installed MNE version at
# runtime and raises a clear error if an older MNE is present (e.g. installed
# separately via the `meg` extra).
mef3 = [
    "mne>=1.12",
    "pymef>=1.4.8",
]
# Parquet + Arrow/Feather serialization (analytics, fast IPC). Install with
# `uv sync --extra arrow`. Zarr will get its own extra in a later phase.
arrow = [
    "pyarrow>=14",
]
# Proprietary electrophysiology acquisition formats (Intan, Blackrock, Spike2,
# Plexon, Micromed, Neuralynx, ...) via python-neo. Install with
# `uv sync --extra neo`.
neo = [
    "neo>=0.13",
]
# Sharded Zarr v3 serving store (viewing + inference + training from one store).
# Install with `uv sync --extra zarr`.
zarr = [
    "zarr>=3",
]
# HDF5 reading of MATLAB v7.3 EEGLAB .set files (h5py). Classic v5/v7 .set
# files need no extra -- scipy.io.loadmat, a core dep, already reads them --
# but scipy (and MNE's EEGLAB reader) refuse v7.3 (HDF5) files outright, so
# reading those is opt-in via this extra rather than a core dep, matching how
# `neo`/`zarr`/`mef3` isolate other niche-or-heavy per-format dependencies.
# Install with `uv sync --extra hdf5`.
hdf5 = [
    "h5py>=3.8",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.14",
    "ty",
    "mne>=1.12",
    "pymef>=1.4.8",
    "pyarrow>=14",
    "neo>=0.13",
    "zarr>=3",
    "h5py>=3.8",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=1.0.0",
    "pymdown-extensions>=10.10.0",
    "mkdocs-jupyter>=0.25.0",
    "mike>=2.1.0",
]
all = [
    "biosigio[dev,docs,meg,mef3,arrow,neo,zarr,hdf5]",
]

[project.urls]
Homepage = "https://github.com/neuromechanist/biosigio"
Documentation = "https://neuromechanist.github.io/biosigio/"
Repository = "https://github.com/neuromechanist/biosigio"
Issues = "https://github.com/neuromechanist/biosigio/issues"
Changelog = "https://github.com/neuromechanist/biosigio/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["biosigio*"]

[tool.ty.src]
# Type-check the shipped package strictly; tests are exercised by running them,
# so gating their typing adds churn for little value (see #43).
exclude = ["biosigio/tests/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["biosigio/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=biosigio",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["biosigio"]
omit = [
    "biosigio/version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
