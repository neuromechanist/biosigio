name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      run: uv python install 3.12

    - name: Create venv and install build dependencies
      run: |
        uv venv --python 3.12
        uv pip install build twine

    - name: Build package
      run: uv run python -m build

    - name: Check package
      run: uv run twine check dist/*

    # A release tagged v1.2.10 while version.py still says 1.2.9 would
    # otherwise upload 1.2.9. Fail before any publish job can run. Runs
    # without a tag (e.g. a manual trigger) skip the check.
    - name: Check tag matches package version
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        if [ "$EVENT_NAME" = "release" ]; then
          tag="$RELEASE_TAG"
        elif [ "$REF_TYPE" = "tag" ]; then
          tag="$REF_NAME"
        else
          echo "No tag for this run ($EVENT_NAME on $REF_TYPE $REF_NAME); skipping version check."
          exit 0
        fi
        expected="${tag#v}"
        source_version=$(python3 -c "import runpy; print(runpy.run_path('biosigio/version.py')['__version__'])")
        status=0
        if [ "$source_version" != "$expected" ]; then
          echo "::error::Tag $tag does not match biosigio/version.py ($source_version)"
          status=1
        fi
        for dist_file in dist/*.whl dist/*.tar.gz; do
          [ -e "$dist_file" ] || { echo "::error::Missing built file matching $dist_file"; status=1; continue; }
          name=$(basename "$dist_file")
          name="${name%.tar.gz}"
          dist_version=$(echo "$name" | cut -d- -f2)
          if [ "$dist_version" != "$expected" ]; then
            echo "::error::Tag $tag does not match built $(basename "$dist_file") ($dist_version)"
            status=1
          fi
        done
        [ "$status" -eq 0 ] && echo "Tag $tag matches package version $expected."
        exit "$status"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  test-install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Download build artifacts
      uses: actions/download-artifact@v7
      with:
        name: dist
        path: dist/

    - name: Create venv and install from wheel
      run: |
        uv venv --python ${{ matrix.python-version }}
        uv pip install dist/*.whl

    - name: Test import
      run: |
        uv run python -c "import biosigio; print(f'biosigIO version: {biosigio.__version__}')"
        uv run python -c "from biosigio import Recording; print('Recording class imported successfully')"

  publish-testpypi:
    needs: [build, test-install]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/biosigio
    permissions:
      id-token: write
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v7
      with:
        name: dist
        path: dist/

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  publish-pypi:
    needs: [build, test-install]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/biosigio
    permissions:
      id-token: write
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v7
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
